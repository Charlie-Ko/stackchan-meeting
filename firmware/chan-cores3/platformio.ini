; Chan 桌面机器人 · 会议记录固件（M5Stack CoreS3）
; 编译：pio run
; 烧录：pio run -t upload            （USB，首次必须走这条）
;       make flash-ota IP=192.168.x.x（WiFi，设备已联网且跑着带 OTA 的固件）
; 串口：pio device monitor
;
; 依赖策略：M5 系列直接用 git 源（tag 锁版本，绕开 PlatformIO registry 下载慢的问题）
;          国内网络若 clone 失败，可先设置：
;          git config --global url."https://gh-proxy.com/https://github.com/".insteadOf "https://github.com/"

[platformio]
src_dir = .

[env:chan-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.33
    https://github.com/m5stack/M5Unified.git#0.2.26
    bblanchon/ArduinoJson@^7.4.3
    links2004/WebSockets@^2.7.2
    ricmoo/QRCode@^0.0.1

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1

board_build.partitions = default_16MB.csv
