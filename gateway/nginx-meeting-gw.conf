# 会议记录机器人网关 · nginx 反向代理
# 目的：ECS 安全组只放行了 80/8643，8000 公网不通。
#       借 80 端口的 nginx 把 /asr/ 反代到本机 8000，设备即可连
#       ws://<公网IP>/asr/ws/device
# 安装：cp 到 /etc/nginx/conf.d/ && nginx -t && nginx -s reload

server {
    listen 80;
    server_name gw.example.com;

    # 保留原有默认页（避免访问根路径变 404）
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # WebSocket + HTTP 反代到网关
    location /asr/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 长连接：会议可能开几小时，别中途掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 手机端会议记录页（二维码扫的就是这里）。
    # 单独给一条短路径，是因为二维码里每个字符都要占用 QR 容量，短一点版本就低一点、好扫。
    location /m/ {
        proxy_pass http://127.0.0.1:8000/m/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 录音文件可能要下几十 MB，别让 nginx 在内存里攒
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
